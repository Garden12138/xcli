name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - run: go mod download
      - name: Check module files
        run: go mod tidy -diff
      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - name: Enforce coverage floors
        run: |
          go test ./... -coverprofile=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/{gsub("%", "", $3); print $3}')"
          awk -v value="$total" 'BEGIN { if (value + 0 < 66.1) exit 1 }'
          for package in runtime runstore; do
            value="$(go test -cover "./internal/${package}" | sed -n 's/.*coverage: \([0-9.]*\)%.*/\1/p')"
            awk -v name="$package" -v value="$value" 'BEGIN {
              if (value == "" || value + 0 < 60) {
                print name " coverage is below 60%: " value "%"
                exit 1
              }
            }'
          done

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - run: go mod download
      - name: Cross-build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/xcli-${{ matrix.goos }}-${{ matrix.goarch }} .

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - run: go mod download
      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: v2.16.0
          args: release --snapshot --clean
