name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - run: go mod download
      - name: Check module files
        run: go mod tidy -diff
      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - name: R3 deterministic comparison and lifecycle fixtures
        run: |
          go build -trimpath -o /tmp/xcli-r3-simulation .
          XCLI_R3_BINARY=/tmp/xcli-r3-simulation python3 -m unittest discover -s tests/r3 -v

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - run: go mod download
      - name: Cross-build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/xcli-${{ matrix.goos }}-${{ matrix.goarch }} .

  package:
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - run: go mod download
      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: v2.16.0
          args: release --snapshot --clean
      - name: Check snapshot archives and native installation
        run: python3 tests/r3/package.py --dist dist --out /tmp/r3-installation.json --native-copy /tmp/xcli-r3-installed
      - name: Check installed candidate configuration and failure reporting
        run: python3 tests/r3/install_acceptance.py --binary /tmp/xcli-r3-installed --out /tmp/r3-installed-acceptance.json
