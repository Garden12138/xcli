name: Frozen experiment regression

on:
  workflow_dispatch:

permissions:
  contents: read

# Manual retained-code coverage. This workflow is not a prerequisite for the
# CLI-first candidate/package jobs in ci.yml and never uses real credentials.
jobs:
  full-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: go mod download
      - run: bash tests/product_realignment/verify-offline.sh

  model-gateway-native-fixtures:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./internal/model... ./tests/model_gateway
      - run: python3 -m unittest discover -s tests/model_gateway -v
