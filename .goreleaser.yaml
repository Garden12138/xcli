version: 2

project_name: xcli

builds:
  - id: xcli
    main: .
    binary: xcli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/Garden12138/xcli/cmd.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: xcli
    binaries:
      - xcli
    homepage: https://github.com/Garden12138/xcli
    description: Local-first control plane for AI coding agent CLIs
    skip_upload: auto
    repository:
      owner: Garden12138
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

release:
  draft: false
  prerelease: auto
  make_latest: true

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
